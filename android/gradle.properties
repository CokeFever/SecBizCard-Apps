# Memory tuned to fit the 8GB Cloud Build machine (E2_HIGHCPU_8). Adding
# purchases_flutter (Play Billing) pushed the old -Xmx4g over the edge → the
# Gradle daemon was OOM-killed ("daemon disappeared"). Keep the JVM heap +
# metaspace modest, single-worker, no daemon, so the whole build stays within
# ~8GB. If a build still OOMs, the next lever is a bigger machineType in
# cloudbuild.yaml (E2_STANDARD_8 = 32GB) rather than raising these.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true

# Optimized resource shrinking (requires AGP 8.12+). Runs resource shrinking
# inside R8's optimization pipeline so resources referenced only by dead code
# are removed too, producing smaller builds. Works with the release build's
# existing isMinifyEnabled + isShrinkResources. Safe here: no dynamic resource
# lookups (getIdentifier) in native code, and Flutter assets are unaffected.
android.r8.optimizedResourceShrinking=true
